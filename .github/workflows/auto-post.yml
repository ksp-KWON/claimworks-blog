name: 보상스쿨 자동글쓰기

on:
  # 매일 KST 09:15~16:15 (= UTC 00:15~07:15), 8개 카테고리 1:1 독립 실행
  schedule:
    - cron: '15 0 * * *'   # KST 09:15 → 사망·자살 보험금
    - cron: '15 1 * * *'   # KST 10:15 → 질병진단·실손
    - cron: '15 2 * * *'   # KST 11:15 → 교통사고 보상
    - cron: '15 3 * * *'   # KST 12:15 → 배상책임·의료
    - cron: '15 4 * * *'   # KST 13:15 → 근재·산재 사고
    - cron: '15 5 * * *'   # KST 14:15 → 장해평가·면책
    - cron: '15 6 * * *'   # KST 15:15 → 보상가이드
    - cron: '15 7 * * *'   # KST 16:15 → 판례·법률 해석
  # 수동 실행 (테스트 및 어드민 연동)
  workflow_dispatch:
    inputs:
      post_type:
        description: '카테고리 선택 (비워두면 랜덤 배정)'
        required: false
        default: ''
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 카테고리 정적 배정 (Delay-Proof)
        id: set_category
        run: |
          # 1. 수동 실행(workflow_dispatch) 우선 처리
          MANUAL="${{ github.event.inputs.post_type }}"
          if [ -n "$MANUAL" ]; then
            echo "POST_TYPE=$MANUAL" >> "$GITHUB_ENV"
            echo "category=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Cron 문자열 자체를 키로 정적 매핑 (실행 지연과 100% 무관)
          #    bash case의 * 는 glob이므로 리터럴 * 는 [*] 로 이스케이프
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            '15 0 [*] [*] [*]') CAT="사망·자살 보험금" ;;
            '15 1 [*] [*] [*]') CAT="질병진단·실손" ;;
            '15 2 [*] [*] [*]') CAT="교통사고 보상" ;;
            '15 3 [*] [*] [*]') CAT="배상책임·의료" ;;
            '15 4 [*] [*] [*]') CAT="근재·산재 사고" ;;
            '15 5 [*] [*] [*]') CAT="장해평가·면책" ;;
            '15 6 [*] [*] [*]') CAT="보상가이드" ;;
            '15 7 [*] [*] [*]') CAT="판례·법률 해석" ;;
            *) CAT="all" ;; # Fallback → select-daily-topic.js의 내부 로직 실행
          esac

          echo "POST_TYPE=$CAT" >> "$GITHUB_ENV"
          echo "category=$CAT" >> "$GITHUB_OUTPUT"

      - name: 자동글쓰기 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
          LAW_PROXY_ENDPOINT: ${{ secrets.LAW_PROXY_ENDPOINT }}
          LAW_PROXY_TOKEN: ${{ secrets.LAW_PROXY_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          echo "✍️ 트리거 스케줄: ${{ github.event.schedule }}"
          echo "✍️ 확정 카테고리: $POST_TYPE"
          npm run generate:post

      - name: 변경사항 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: [${{ steps.set_category.outputs.category }}] 자동글쓰기 콘텐츠 생성"
          file_pattern: 'src/content/posts/*.md'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
