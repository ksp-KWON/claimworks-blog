name: 보상스쿨 자동글쓰기

on:
  # 매일 오전 7시 (KST) = UTC 22:00 전날
  schedule:
    - cron: '0 22 * * *'
  # 수동 실행 (테스트용)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 의존성 설치
        run: npm ci

      - name: 자동글쓰기 실행 (인사이트 + 판례 분석 총 2개 생성)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: |
          node scripts/generate-blog-post.js
          node scripts/generate-precedent-post.js

      - name: prebuild 실행 (posts-data.json 갱신)
        run: node scripts/prebuild.js

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/ src/lib/posts-data.json public/data/posts-data.json public/rss.xml public/sitemap.xml
          git diff --cached --quiet || git commit -m "auto: 자동글쓰기 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          git push
