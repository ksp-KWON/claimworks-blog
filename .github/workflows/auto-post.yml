name: 보상스쿨 자동글쓰기

on:
  # 매일 오전 9시 15분 ~ 오후 4시 15분 (KST) = UTC 00:15 ~ 07:15
  schedule:
    - cron: '15 0-7 * * *'
  # 수동 실행 (테스트용 및 어드민 연동)
  workflow_dispatch:
    inputs:
      post_type:
        description: '발행할 카테고리 선택 (all: 시간대 자동 배정)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - 사망·자살 보험금
          - 질병진단·실손
          - 교통사고 보상
          - 배상책임·의료
          - 근재·산재 사고
          - 장해평가·면책
          - 보상가이드
          - 판례·법률 해석

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 자동글쓰기 실행 (선택적)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
          LAW_PROXY_ENDPOINT: ${{ secrets.LAW_PROXY_ENDPOINT }}
          LAW_PROXY_TOKEN: ${{ secrets.LAW_PROXY_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          POST_TYPE="${{ github.event.inputs.post_type }}"
          if [ -z "$POST_TYPE" ]; then
            POST_TYPE="all"
          fi
          
          echo "✍️ 자동글쓰기 통합 엔진 기동 (카테고리: $POST_TYPE)"
          POST_TYPE="$POST_TYPE" npm run generate:post

      - name: 변경사항 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: 자동글쓰기 콘텐츠 생성"
          file_pattern: 'src/content/posts/*.md'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
