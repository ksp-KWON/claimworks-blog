name: Auto Generate Daily Blog Post

on:
  schedule:
    - cron: '47 21 * * *'  # 매일 한국시간 오전 6시 47분
  workflow_dispatch:       # 수동 실행 (테스트용)
  repository_dispatch:
    types: [run-auto-post]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # 최대 15분 (429 재시도 포함 여유 있게)
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1          # 기존 포스트 파일 전체를 읽어야 하므로 전체 히스토리 불필요

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm ci

      - name: 자동글쓰기 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog-post.js

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/
          # 새 파일이 없으면 커밋하지 않음 (오류 방지)
          git diff --cached --quiet || git commit -m "auto: 자동글쓰기 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          git push origin main
