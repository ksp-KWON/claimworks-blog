name: 보상스쿨 자동글쓰기

on:
  # 매일 KST 09:27~16:41 (= UTC 00:27~07:41), 8개 카테고리 1:1 트래픽 분산 실행 (Off-Peak)
  schedule:
    - cron: '27 0 * * *'   # KST 09:27 → 사망·자살 보험금
    - cron: '38 1 * * *'   # KST 10:38 → 질병진단·실손
    - cron: '42 2 * * *'   # KST 11:42 → 교통사고 보상
    - cron: '47 3 * * *'   # KST 12:47 → 배상책임·의료
    - cron: '36 4 * * *'   # KST 13:36 → 근재·산재 사고
    - cron: '43 5 * * *'   # KST 14:43 → 장해평가·면책
    - cron: '37 6 * * *'   # KST 15:37 → 보상가이드
    - cron: '41 7 * * *'   # KST 16:41 → 판례·법률 해석
  
  # 수동 실행 (테스트 및 어드민 연동)
  workflow_dispatch:
    inputs:
      post_type:
        description: '카테고리 선택 (수동 실행용)'
        required: true
        default: 'auto'     
        type: choice        
        options:
          - auto
          - 사망·자살 보험금
          - 질병진단·실손
          - 교통사고 보상
          - 배상책임·의료
          - 근재·산재 사고
          - 장해평가·면책
          - 보상가이드
          - 판례·법률 해석

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 정적 카테고리 배정 (Delay-Proof)
        id: set_category
        run: |
          # 1. 수동 실행 시 'auto'가 아니면 수동 선택값 사용
          MANUAL="${{ github.event.inputs.post_type }}"
          if [ -n "$MANUAL" ] && [ "$MANUAL" != "auto" ]; then
            echo "POST_TYPE=$MANUAL" >> "$GITHUB_ENV"
            echo "category=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # 2. Delay-Proof: 지연 실행과 무관하게 Trigger된 고유 Cron 문자열 매핑
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            '27 0 * * *') CAT="사망·자살 보험금" ;;
            '38 1 * * *') CAT="질병진단·실손" ;;
            '42 2 * * *') CAT="교통사고 보상" ;;
            '47 3 * * *') CAT="배상책임·의료" ;;
            '36 4 * * *') CAT="근재·산재 사고" ;;
            '43 5 * * *') CAT="장해평가·면책" ;;
            '37 6 * * *') CAT="보상가이드" ;;
            '41 7 * * *') CAT="판례·법률 해석" ;;
            *) CAT="all" ;; 
          esac
          
          echo "POST_TYPE=$CAT" >> "$GITHUB_ENV"
          echo "category=$CAT" >> "$GITHUB_OUTPUT"

      - name: 자동글쓰기 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
          LAW_PROXY_ENDPOINT: ${{ secrets.LAW_PROXY_ENDPOINT }}
          LAW_PROXY_TOKEN: ${{ secrets.LAW_PROXY_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          echo "✍️ 트리거된 스케줄: ${{ github.event.schedule }}"
          echo "✍️ 확정 카테고리: $POST_TYPE"
          npm run generate:post

      - name: 금감원 소비자보호센터 보도자료 동기화
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "📢 금감원 보도자료 및 소비자경보 업데이트 수집 중..."
          node scripts/generate-fss-news.js || true

      - name: 원격 브랜치 최신화 (충돌 방지)
        run: git pull origin main --autostash --rebase

      - name: 변경사항 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: [${{ steps.set_category.outputs.category }}] 자동글쓰기 및 금감원 뉴스 업데이트"
          file_pattern: 'src/content/posts/*.md public/data/*.json'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
