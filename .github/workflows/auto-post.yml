name: 보상스쿨 자동글쓰기

on:
  # 매일 오전 7시 (KST) = UTC 22:00 전날
  schedule:
    - cron: '0 22 * * *'
  # 수동 실행 (테스트용 및 어드민 연동)
  workflow_dispatch:
    inputs:
      post_type:
        description: '발행할 글 종류 선택 (all: 전체, precedent: 법률칼럼, trend: 트렌드)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - precedent
          - trend

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 의존성 설치
        run: npm ci

      - name: 자동글쓰기 실행 (선택적)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
          LAW_PROXY_ENDPOINT: ${{ secrets.LAW_PROXY_ENDPOINT }}
          LAW_PROXY_TOKEN: ${{ secrets.LAW_PROXY_TOKEN }}
        run: |
          POST_TYPE="${{ github.event.inputs.post_type }}"
          if [ -z "$POST_TYPE" ]; then
            POST_TYPE="all"
          fi
          
          echo "📊 선택된 발행 유형: $POST_TYPE"
          
          # 모든 자동글쓰기에 공동 활용될 당일의 트렌드 및 법제처 판례를 선 수집 확정합니다.
          echo "🔍 오늘의 주제 및 판례 사전 탐색 실행 (scripts/select-daily-topic.js)"
          node scripts/select-daily-topic.js
          
          if [ "$POST_TYPE" = "all" ] || [ "$POST_TYPE" = "trend" ]; then
            echo "🔥 트렌드 글쓰기 기동 (scripts/generate-blog-post.js)"
            node scripts/generate-blog-post.js
          fi
          
          if [ "$POST_TYPE" = "all" ] || [ "$POST_TYPE" = "precedent" ]; then
            echo "⚖️ 법률칼럼 글쓰기 기동 (scripts/generate-precedent-post.js)"
            node scripts/generate-precedent-post.js
          fi

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 새롭게 자동 작성된 포스트(.md) 파일만 스테이징
          git add src/content/posts/
          
          # 2. 신규 작성글이 존재하는 경우에만 처리 진행
          if ! git diff --cached --quiet; then
            # 3. 신규 글을 커밋 (글 파일명은 겹치지 않으므로 100% 충돌 없음)
            git commit -m "auto: 자동글쓰기 콘텐츠 생성 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
            
            # 4. 원격 저장소의 최신 커밋을 땡겨와 안전하게 리베이스 진행
            git pull --rebase origin main
            
            # 5. 원격 저장소에 최종 푸시
            git push origin main
          fi
