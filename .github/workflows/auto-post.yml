name: 보상스쿨 자동글쓰기

on:
  # 매일 오전 7시 (KST) = UTC 22:00 전날
  schedule:
    - cron: '0 22 * * *'
  # 수동 실행 (테스트용)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # 최대 15분 (429 재시도 포함 여유 있게)
    permissions:
      contents: write            # git push 권한 필수

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 기존 포스트 파일 전체를 읽어야 하므로 전체 히스토리 불필요
          fetch-depth: 1

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'     # fetch 내장 지원 (18+이면 OK)

      - name: 자동글쓰기 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog-post.js

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/
          # 새 파일이 없으면 커밋하지 않음 (오류 방지)
          git diff --cached --quiet || git commit -m "auto: 자동글쓰기 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          git push
