name: Search Console CTR Title Renewal
on:
  schedule:
    # 매주 일요일 밤 23:00 KST (UTC 14:00)
    - cron: '0 14 * * 0'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: 의존성 설치
        run: npm ci

      - name: Run Title Renewal Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: node scripts/renew-titles.js
        
      - name: 변경사항 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: Search Console CTR 기반 지능형 제목 리뉴얼 및 FAQ 추가"
          file_pattern: "src/content/posts/*.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
